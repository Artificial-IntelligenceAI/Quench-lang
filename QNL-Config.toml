# What this project has decided, once, for every file in it.
#
# Settings come in two kinds and they do not cost the same. One changes what a program
# *answers*, and every value of it is a separate language the three engines must agree
# under. The other changes what gets *delivered*, and costs nothing to test.

[defaults]
# Changes what a program answers. `truncated` rounds toward zero and the remainder
# follows the dividend, which is what every processor does. `floored` rounds toward
# negative infinity and the remainder follows the divisor, which is what a mathematician
# means and what makes `x % n` always land in `0..n`.
division = "truncated"

# Also changes what a program answers. `wrap` rounds a sum that does not fit back into
# the type, as the processor does; `trap` stops instead, in the same place and for the
# same reason in every engine. Wrapping is fast and is occasionally the reason a program
# is quietly wrong for a year.
overflow = "wrap"

# Also changes what a program answers, and only started to when functions arrived:
# before a program could call anything, nothing inside an expression could *do*
# anything, so both answers gave identical programs. `stops-early` means `and` asks its
# right side only when the left was true, and `or` only when it was false. The reason
# it is the default is not speed -- Quench stops rather than having undefined
# behaviour, so under `asks-both` a guard like `('n' != *0*) and ((*100* / 'n') > *5*)`
# does not merely waste a division, it stops the program.
logic = "stops-early"

# What a `b64` does when there is no number to give back. `carries-on` answers
# `infinity` or `not-a-number` and continues, as the processor does; `stops` stops.
#
# Carrying on is the default for a different reason than `overflow = "wrap"`: `b64` *is*
# IEEE 754 binary64, and `infinity` and `not-a-number` are values of that type rather
# than accidents of it. Asking to stop is asking for something narrower than the type
# you named.
no-number = "carries-on"

# Also changes what a program answers, and the only one so far about text rather than
# numbers. What counts as one character of a `str`, which is what `count` counts.
#
# `count['café']` is 4 either way. `count['🧑‍🧑‍🧒‍🧒']` is 1 under `clusters` and 7 under
# `letters`, because that emoji is seven scalars welded together with zero-width joiners
# and one thing on the page.
#
# `clusters` is the default because it is what a person counting characters means, and
# because Quench already had the whole of UAX #29 for putting a caret under the right
# column -- the algorithm arrived before the question did. What it costs is that the
# answer is tied to a Unicode version: clusters are defined by tables Unicode revises,
# so a program can count differently after a bump nothing else would notice. `letters`
# is one Unicode scalar, which needs no table and never changes.
characters = "clusters"

# Also changes what a program answers, and named for the two operations because those
# are the only two it touches. What `min` and `max` do when one side is not a number.
#
# `call min['nan', *5.0*]` is `5` under `skips` and a not-a-number under `spreads`, and
# both are somebody's idea of right: C's `fmin` skips, Java's `Math.min` spreads, and
# IEEE 754-2019 specifies both because 2008 tried to have one and nobody agreed which.
#
# `skips` is the default on the reading that a not-a-number in a `min` is usually a
# measurement that failed rather than an error to carry -- which is what the standard's
# `minimumNumber` is for and why it exists at all.
min-max = "skips"

[build]
# Changes what gets delivered, never what a program answers -- every level has to
# produce the same number, which is what the oracle checks. `none`, `speed`, or
# `speed-and-size`.
#
# This is really a setting for ahead-of-time output, which otherwise takes everything it
# can and as long as it likes: nobody waits at a keyboard for a binary about to be
# shipped, and it is the one engine whose compile time is paid once and whose run time
# is paid by everybody. Turn it down when a build only has to exist.
#
# The Dev JIT never consults it and stays at `none` -- being the engine that did the
# least is what makes it the one to believe. The Hot JIT decides for itself, per
# function, which is what makes it the hot one.
optimise = "speed"

[run]
# Changes only how a program runs, never what it says.
engine = "dev-jit"
