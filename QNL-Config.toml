# What this project has decided, once, for every file in it.
#
# Settings come in two kinds and they do not cost the same. One changes what a program
# *answers*, and every value of it is a separate language the three engines must agree
# under. The other changes what gets *delivered*, and costs nothing to test.

[defaults]
# Changes what a program answers. `truncated` rounds toward zero and the remainder
# follows the dividend, which is what every processor does. `floored` rounds toward
# negative infinity and the remainder follows the divisor, which is what a mathematician
# means and what makes `x % n` always land in `0..n`.
division = "truncated"

# Also changes what a program answers. `wrap` rounds a sum that does not fit back into
# the type, as the processor does; `trap` stops instead, in the same place and for the
# same reason in every engine. Wrapping is fast and is occasionally the reason a program
# is quietly wrong for a year.
overflow = "wrap"

[build]
# Changes what gets delivered, never what a program answers -- every level has to
# produce the same number, which is what the oracle checks. `none`, `speed`, or
# `speed-and-size`.
#
# This is really a setting for ahead-of-time output, which otherwise takes everything it
# can and as long as it likes: nobody waits at a keyboard for a binary about to be
# shipped, and it is the one engine whose compile time is paid once and whose run time
# is paid by everybody. Turn it down when a build only has to exist.
#
# The Dev JIT never consults it and stays at `none` -- being the engine that did the
# least is what makes it the one to believe. The Hot JIT decides for itself, per
# function, which is what makes it the hot one.
optimise = "speed"

[run]
# Changes only how a program runs, never what it says.
engine = "dev-jit"
